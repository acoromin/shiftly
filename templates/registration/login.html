{% extends "base.html" %}

{% block title %}Iniciar sesión | Xarlot{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-12 col-sm-9 col-md-6 col-lg-4">
        <div class="card shadow-sm">
            <div class="card-body p-4">
                <h1 class="h4 mb-3">Iniciar sesión</h1>
                {% if form.errors %}
                    <div class="alert alert-danger">
                        {% if form.non_field_errors %}{{ form.non_field_errors }}{% else %}Usuario o contraseña incorrectos.{% endif %}
                    </div>
                {% endif %}
                <form method="post" novalidate>
                    {% csrf_token %}
                    <input type="hidden" name="next" value="{{ next|default:'' }}">
                    <div class="mb-3">
                        <label class="form-label" for="{{ form.username.id_for_label }}">Usuario</label>
                        <input
                            class="form-control"
                            type="text"
                            name="{{ form.username.html_name }}"
                            id="{{ form.username.id_for_label }}"
                            autocomplete="username"
                            required
                        >
                    </div>
                    <div class="mb-3">
                        <label class="form-label" for="{{ form.password.id_for_label }}">Contraseña</label>
                        <input
                            class="form-control"
                            type="password"
                            name="{{ form.password.html_name }}"
                            id="{{ form.password.id_for_label }}"
                            autocomplete="current-password"
                            required
                        >
                    </div>
                    <button class="btn btn-primary w-100" type="submit">Iniciar sesión</button>
                </form>
            </div>
        </div>
    </div>
</div>
<script>
    const loginQrData = new URLSearchParams(window.location.hash.slice(1));
    const loginQrToken = loginQrData.get('token');
    const loginQrWorkplace = loginQrData.get('workplace');
    if (loginQrToken && /^[A-Za-z0-9_-]{16,128}$/.test(loginQrToken)
        && loginQrWorkplace && /^[0-9a-fA-F-]{36}$/.test(loginQrWorkplace)) {
        document.querySelector('input[name="next"]').value =
            '{% url "timeclock:scan" %}#workplace=' + loginQrWorkplace + '&token=' + loginQrToken;
        window.history.replaceState(null, '', window.location.pathname + window.location.search);
    }
</script>
{% endblock %}
